site_name: Proteus
site_description: Human genome simulation, mutation, and viability analysis
site_author: ESS KS Life Tech
site_url: https://esskslifetech.github.io/proteus

repo_name: esskslifetech/proteus
repo_url: https://github.com/esskslifetech/proteus

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - content.code.copy
    - content.code.annotate
  palette:
    - scheme: default
      primary: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.tasklist:
      custom_checkbox: true

nav:
  - Home: index.md
  - Architecture:
      - Polyglot ADR: adr/001-polyglot-architecture.md

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            show_source: false
            show_root_heading: true
            show_category_heading: true
            members:
              - __init__

extra:
  version: 0.1.0
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/esskslifetech/proteus