[project]
name = "proteus"
version = "0.1.0"
description = "Human genome simulation, mutation, and viability analysis"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [
    {name = "ESS KS Life Tech", email = "esskslifetech@gmail.com"}
]
dependencies = [
    # Core scientific stack
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.1",

    # API / CLI
    "fastapi>=0.105",
    "uvicorn>=0.25",
    "typer>=0.9",
    "rich>=13.0",

    # Reports
    "jinja2>=3.1",
    "reportlab>=5.1",

    # Serialization / Validation
    "pydantic>=2.5",
    "jsonschema>=4.20",
    "protobuf>=4.25",

    # Content hashing
    "blake3>=0.4",

    # Visualization
    "matplotlib>=3.11",
    "networkx>=3.6",
    "pillow>=13.0",
]

[project.optional-dependencies]
genomics = [
    "pysam>=0.22",
    "pyfaidx>=0.7",
    "gffutils>=0.12",
    "intervaltree>=3.1",
]
ml = [
    "torch>=2.1",
    "transformers>=4.36",
    "esm>=2.0",
    "biopython>=1.83",
]
workflow = [
    "snakemake>=8.0",
    "luigi>=3.5",
]
reports = [
    "weasyprint>=60.0",
    "pylatex>=1.4",
    "rocrate>=0.3",
]
visualization = [
    "seaborn>=0.13",
]
data = [
    "polars>=0.40",
    "pyarrow>=14.0",
    "fsspec>=2023.10",
    "dvc>=3.0",
]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "pytest-xdist>=3.5",
    "hypothesis>=6.90",
    "ruff>=0.1.0",
    "mypy>=1.7",
    "pre-commit>=3.6",
]
docs = [
    "mkdocs>=1.5",
    "mkdocs-material>=9.4",
    "mkdocstrings[python]>=0.24",
]
bench = [
    "pytest-benchmark>=4.0",
    "asv>=0.5",
]
all = ["proteus[dev,docs,bench]"]

[tool.setuptools.packages.find]
where = ["."]
include = ["proteus*"]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "I", "UP", "W", "C4", "C90", "PL", "T20", "PERF", "ARG", "PTH", "SIM", "RUF", "TRY"]
ignore = ["TRY003", "ARG001"]
preview = true

[tool.ruff.per-file-ignores]
"tests/*" = ["S101", "S106"]
"proteus/ml/*" = ["TRY003"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
strict_equality = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = "proteus._proteus"
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short -q"

[tool.coverage.run]
source = ["proteus"]
omit = ["*/tests/*", "*/conftest.py"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "def __repr__", "raise AssertionError", "raise NotImplementedError"]